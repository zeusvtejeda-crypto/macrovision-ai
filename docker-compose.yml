version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: macrovision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: macrovision
      POSTGRES_PASSWORD: macrovision_pass
      POSTGRES_DB: macrovision_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U macrovision -d macrovision_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - macrovision_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: macrovision_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_pass_change_me
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - macrovision_network

  # NestJS Backend API
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: macrovision_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://macrovision:macrovision_pass@postgres:5432/macrovision_db
      REDIS_URL: redis://:redis_pass_change_me@redis:6379
    env_file:
      - .env
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    ports:
      - '3000:3000'
      - '9229:9229'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - macrovision_network
    command: npm run start:dev

  # Next.js Admin Dashboard
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: development
    container_name: macrovision_admin
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
      - /app/.next
    ports:
      - '3001:3001'
    depends_on:
      - backend
    networks:
      - macrovision_network
    command: npm run dev

  # Nginx Reverse Proxy (development)
  nginx:
    image: nginx:alpine
    container_name: macrovision_nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    depends_on:
      - backend
      - admin
    networks:
      - macrovision_network

  # pgAdmin (development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: macrovision_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@macrovision.ai
      PGADMIN_DEFAULT_PASSWORD: pgadmin_pass
    ports:
      - '5050:80'
    depends_on:
      - postgres
    networks:
      - macrovision_network
    profiles:
      - tools

  # Redis Commander (development only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: macrovision_redis_commander
    environment:
      REDIS_HOSTS: 'local:redis:6379:0:redis_pass_change_me'
    ports:
      - '8081:8081'
    depends_on:
      - redis
    networks:
      - macrovision_network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  macrovision_network:
    driver: bridge
