upstream backend {
    server backend:3000;
    keepalive 32;
}

upstream admin {
    server admin:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    # API Backend
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        # Rate limit especial para análisis IA
        location /api/v1/analysis {
            limit_req zone=analysis burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 90s;    # IA puede tardar
            proxy_send_timeout 30s;
        }

        # Rate limit para auth
        location /api/v1/auth/login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Stripe Webhooks — sin rate limit, con timeout largo
    location /api/v1/subscriptions/webhook {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Swagger docs (solo dev)
    location /api/docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Admin Dashboard
    location /admin {
        proxy_pass http://admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check
    location /health {
        proxy_pass http://backend/api/v1/health;
        access_log off;
    }
}
