name: Deploy — MacroVision AI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno destino'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway (Staging)
        run: |
          npm install -g @railway/cli
          railway up --service macrovision-backend-staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Run DB Migrations
        run: |
          railway run --service macrovision-backend-staging \
            "npx prisma migrate deploy"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Smoke Test
        run: |
          sleep 15
          curl -f https://api-staging.macrovision.ai/api/v1/health || exit 1

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: 'MacroVision Staging Deploy'
          SLACK_MESSAGE: '${{ job.status == "success" && "✅ Staging deployment exitoso" || "❌ Staging deployment falló" }}'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to AWS ECS
        run: echo "Deploy to ECS implementation here"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Notify team
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: '🚀 MacroVision Production Release'
          SLACK_MESSAGE: 'Version ${{ github.ref_name }} deployed'
